{% extends 'console/base.html' %}
{% load i18n %}
{% block content %}
<div class="mx-auto max-w-2xl space-y-6">
  <h1 class="text-2xl font-bold">{% trans "Resetar dados de teste" %}</h1>
  <p class="text-red-600">{% trans "Esta ação apaga os dados de teste dos schemas tenant e recria o ambiente demonstrativo." %}</p>
  {% if error %}<p class="rounded bg-red-100 p-3 text-red-800">{{ error }}</p>{% endif %}
  <form method="post" class="space-y-4 rounded-lg border p-6">
    {% csrf_token %}
    <label class="block text-sm font-medium">{% trans "Digite RESETAR para confirmar" %}</label>
    <input name="confirmation" class="block w-full rounded border px-3 py-2" autocomplete="off" required>
    <button class="rounded bg-red-600 px-4 py-2 font-semibold text-white" type="submit">{% trans "Resetar e popular ambiente" %}</button>
  </form>
</div>
{% endblock %}
