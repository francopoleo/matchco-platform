
{% load i18n %}{% load static %}
{% comment %}{% trans "Quill 2 é open source BSD-3-Clause e servido localmente pelo Django." %}{% endcomment %}
<link rel="stylesheet" href="{% static 'ui/vendor/quill/quill.snow.css' %}">
<link rel="stylesheet" href="{% static 'ui/vendor/quill/quill-table-better.css' %}">
<script src="{% static 'ui/vendor/quill/quill.js' %}"></script>
<script src="{% static 'ui/vendor/quill/quill-table-better.js' %}"></script>
<style>
  .quill-rich-editor { border: 1px solid #d1d5db; border-radius: .5rem; overflow: hidden; }
  textarea.rich-editor-original { display: none !important; }
  .quill-rich-editor .rich-editor-modes { display: flex; gap: .35rem; padding: .5rem .75rem; border-bottom: 1px solid #d1d5db; background: #f1f5f9; }
  .quill-rich-editor .rich-editor-mode { border: 1px solid transparent; border-radius: .375rem; padding: .35rem .7rem; color: #475569; font-size: .8125rem; font-weight: 600; cursor: pointer; }
  .quill-rich-editor .rich-editor-mode:hover, .quill-rich-editor .rich-editor-mode.is-active { border-color: #2563eb; color: #1d4ed8; background: #dbeafe; }
  .quill-rich-editor .rich-editor-source { display: none; width: 100%; min-height: 320px; resize: vertical; border: 0; padding: 1rem; outline: 0; font: 500 .875rem/1.65 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; background: #fff; color: #0f172a; }
  .quill-rich-editor.is-source .rich-editor-source { display: block; }
  .quill-rich-editor.is-source .ql-toolbar, .quill-rich-editor.is-source .ql-container { display: none; }
  .quill-rich-editor .ql-toolbar { border: 0; border-bottom: 1px solid #d1d5db; background: #f8fafc; }
  .quill-rich-editor .ql-container { border: 0; min-height: 260px; font-size: 1rem; }
  .quill-rich-editor .ql-editor { min-height: 260px; line-height: 1.65; }
  .quill-rich-editor .ql-editor p { margin: 0 0 .75rem; }
  .quill-rich-editor .ql-table-better { width: 24px; }
  .quill-rich-editor .ql-library-actions { display: block; margin: .35rem 0 0; padding: .35rem 0 0; border-top: 1px solid #d1d5db; }
  .quill-rich-editor .ql-library-actions button { width: auto; min-width: 86px; height: 28px; padding: 3px 8px; border: 1px solid #cbd5e1; border-radius: .35rem; font-size: 11px; font-weight: 700; line-height: 20px; }
  .quill-rich-editor .ql-library-actions button + button { margin-left: .35rem; }
  .quill-rich-editor .ql-library-actions svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 3px; }
  .rich-library-backdrop { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1rem; background: rgb(15 23 42 / .65); }
  .rich-library-dialog { width: min(720px, 100%); max-height: 80vh; overflow: auto; border-radius: .75rem; background: #fff; color: #0f172a; padding: 1rem; box-shadow: 0 20px 50px rgb(0 0 0 / .25); }
  .dark .rich-library-dialog { background: #1f2937; color: #f9fafb; }
  .rich-library-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .75rem; margin-top: 1rem; }
  .rich-library-item { min-height: 110px; border: 1px solid #cbd5e1; border-radius: .5rem; padding: .6rem; text-align: left; cursor: pointer; }
  .rich-library-item:hover { border-color: #2563eb; background: #eff6ff; }
  .dark .rich-library-item { border-color: #4b5563; } .dark .rich-library-item:hover { background: #1e3a8a; }
  .dark .quill-rich-editor { border-color: #4b5563; }
  .dark .quill-rich-editor .ql-toolbar { background: #111827; border-color: #4b5563; }
  .dark .quill-rich-editor .ql-container { background: #1f2937; color: #f9fafb; }
  .dark .quill-rich-editor .ql-stroke { stroke: #e5e7eb; }
  .dark .quill-rich-editor .ql-fill { fill: #e5e7eb; }
  .dark .quill-rich-editor .ql-picker { color: #f9fafb; }
  .dark .quill-rich-editor .ql-picker-label { color: #f9fafb; }
  .dark .quill-rich-editor .ql-picker-options { background: #111827; border-color: #4b5563; color: #f9fafb; }
  .dark .quill-rich-editor .ql-picker-item:hover { color: #93c5fd; }
  .dark .quill-rich-editor .rich-editor-modes { border-color: #4b5563; background: #111827; }
  .dark .quill-rich-editor .rich-editor-mode { color: #cbd5e1; }
  .dark .quill-rich-editor .rich-editor-mode:hover, .dark .quill-rich-editor .rich-editor-mode.is-active { border-color: #60a5fa; color: #bfdbfe; background: #1e3a8a; }
  .dark .quill-rich-editor .rich-editor-source { background: #1f2937; color: #f9fafb; }
  .dark .quill-rich-editor button:hover,
  .dark .quill-rich-editor .ql-picker-label:hover { background: #374151; }
  .dark .quill-rich-editor button:hover .ql-stroke { stroke: #f9fafb; }
  .dark .quill-rich-editor button:hover .ql-fill { fill: #f9fafb; }
  .quill-rich-content ul { list-style-type: disc; padding-left: 1.5rem; }
  .quill-rich-content ol { list-style-type: decimal; padding-left: 1.5rem; }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (!window.Quill) return;
    document.querySelectorAll('textarea[data-rich-editor="true"]').forEach(function (textarea, index) {
      if (textarea.dataset.editorReady) return;
      textarea.dataset.editorReady = 'true';

      const wrapper = document.createElement('div');
      wrapper.className = 'quill-rich-editor';
      const modes = document.createElement('div');
      modes.className = 'rich-editor-modes';
      modes.innerHTML = '<button type="button" class="rich-editor-mode is-active" data-editor-mode="visual">Mensagem</button><button type="button" class="rich-editor-mode" data-editor-mode="source">HTML</button><span class="ml-2 self-center text-xs text-slate-500 dark:text-slate-400">Edite a mensagem visualmente ou cole HTML diretamente.</span>';
      const toolbar = document.createElement('div');
      toolbar.innerHTML = '<span class="ql-formats"><select class="ql-header" aria-label="Título"><option selected></option><option value="2"></option><option value="3"></option></select><select class="ql-size" aria-label="Tamanho"><option value="small"></option><option selected></option><option value="large"></option><option value="huge"></option></select><select class="ql-font" aria-label="Fonte"><option selected></option><option value="serif"></option><option value="monospace"></option></select></span><span class="ql-formats"><button class="ql-bold" aria-label="Negrito"></button><button class="ql-italic" aria-label="Itálico"></button><button class="ql-underline" aria-label="Sublinhado"></button><button class="ql-strike" aria-label="Tachado"></button><button class="ql-script" value="sub" aria-label="Subscrito"></button><button class="ql-script" value="super" aria-label="Sobrescrito"></button></span><span class="ql-formats"><select class="ql-color" aria-label="Cor do texto"></select><select class="ql-background" aria-label="Destaque"></select><select class="ql-align" aria-label="Alinhamento"></select></span><span class="ql-formats"><button class="ql-blockquote" aria-label="Citação"></button><button class="ql-code-block" aria-label="Bloco de código"></button><button class="ql-list" value="ordered" aria-label="Lista numerada"></button><button class="ql-list" value="bullet" aria-label="Lista com marcadores"></button><button class="ql-indent" value="-1" aria-label="Diminuir recuo"></button><button class="ql-indent" value="+1" aria-label="Aumentar recuo"></button></span><span class="ql-formats"><button class="ql-link" aria-label="Link"></button><button class="ql-image" aria-label="Imagem por URL" title="Imagem por URL"></button><button class="ql-table-better" aria-label="Inserir tabela" title="Inserir tabela"></button><button class="ql-clean" aria-label="Limpar formatação" title="Limpar formatação"></button></span><span class="ql-formats ql-library-actions"><button class="ql-media" type="button" title="Inserir da biblioteca" aria-label="Inserir mídia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg>Mídia</button><button class="ql-document" type="button" title="Vincular documento" aria-label="Vincular documento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg>Documento</button></span>';
      const editor = document.createElement('div');
      editor.setAttribute('aria-label', 'Conteúdo formatado');
      const sourceEditor = document.createElement('textarea');
      sourceEditor.className = 'rich-editor-source';
      sourceEditor.setAttribute('aria-label', 'HTML editável do conteúdo');
      sourceEditor.value = textarea.value || '';
      wrapper.append(modes, toolbar, editor, sourceEditor);
      // Keep the original named textarea in the form. Replacing it with a
      // second hidden input can make the visual editor diverge from the
      // value Django receives during POST.
      textarea.hidden = true;
      textarea.style.display = 'none';
      textarea.setAttribute('aria-hidden', 'true');
      textarea.classList.add('rich-editor-original');
      textarea.parentNode.insertBefore(wrapper, textarea);

      Quill.register({ 'modules/table-better': QuillTableBetter }, true);
      const quill = new Quill(editor, {
        theme: 'snow',
        modules: {
          toolbar: {
            container: toolbar,
            handlers: {
              image: function () {
                const url = window.prompt('Cole a URL da imagem (https://...)');
                if (!url || !/^https?:\/\//i.test(url)) return;
                const range = quill.getSelection(true);
                quill.insertEmbed(range.index, 'image', url, 'user');
                quill.setSelection(range.index + 1, 0, 'silent');
              },
              media: function () { openLibraryPicker('/console/media/api/', 'Escolha uma mídia da biblioteca', function (item) {
                const range = quill.getSelection(true);
                if (item.kind === 'image') { quill.insertEmbed(range.index, 'image', item.url, 'user'); quill.setSelection(range.index + 1, 0, 'silent'); }
                else { const label = item.title || 'Abrir mídia'; quill.insertText(range.index, label, { link: item.url }, 'user'); quill.setSelection(range.index + label.length, 0, 'silent'); }
              }); },
              document: function () { openLibraryPicker('/console/documents/api/', 'Escolha um documento para vincular', function (item) {
                const range = quill.getSelection(true); quill.insertText(range.index, item.title, { link: item.url }, 'user'); quill.setSelection(range.index + item.title.length, 0, 'silent');
              }); }
            }
          },
          table: false,
          'table-better': { language: 'pt_BR', toolbarTable: true },
          keyboard: { bindings: QuillTableBetter.keyboardBindings }
        }
      });
      if (textarea.value) {
        const initialHtml = /<[^>]+>/.test(textarea.value) ? textarea.value : textarea.value.replace(/\r?\n/g, '<br>');
        quill.clipboard.dangerouslyPasteHTML(initialHtml);
      }
      const syncSource = function () {
        textarea.value = quill.root.innerHTML;
        sourceEditor.value = textarea.value;
      };
      quill.on('text-change', syncSource);
      const setMode = function (mode) {
        const sourceMode = mode === 'source';
        if (sourceMode) {
          syncSource();
        } else if (sourceEditor.value !== textarea.value) {
          quill.clipboard.dangerouslyPasteHTML(sourceEditor.value || '');
          syncSource();
        }
        wrapper.classList.toggle('is-source', sourceMode);
        modes.querySelectorAll('[data-editor-mode]').forEach(function (button) {
          button.classList.toggle('is-active', button.dataset.editorMode === mode);
        });
      };
      modes.querySelectorAll('[data-editor-mode]').forEach(function (button) {
        button.addEventListener('click', function () { setMode(button.dataset.editorMode); });
      });
      sourceEditor.addEventListener('input', function () { textarea.value = sourceEditor.value; });
      const form = wrapper.closest('form');
      if (form) form.addEventListener('submit', function () {
        const table = quill.getModule('table-better');
        if (table && table.deleteTableTemporary) table.deleteTableTemporary();
        if (wrapper.classList.contains('is-source')) textarea.value = sourceEditor.value;
        else syncSource();
      });
    });

    function openLibraryPicker(endpoint, title, onSelect) {
      const backdrop = document.createElement('div'); backdrop.className = 'rich-library-backdrop';
      const dialog = document.createElement('div'); dialog.className = 'rich-library-dialog';
      dialog.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;gap:1rem"><strong>' + title + '</strong><button type="button" data-close style="font-size:1.4rem">×</button></div><input type="search" placeholder="Buscar..." style="width:100%;margin-top:.75rem;padding:.55rem;border:1px solid #cbd5e1;border-radius:.4rem"><div class="rich-library-items"><span>Carregando...</span></div><p style="margin-top:1rem;font-size:.8rem;opacity:.75">Cadastre novos itens em Console → Biblioteca de mídia ou Documentos.</p>';
      backdrop.appendChild(dialog); document.body.appendChild(backdrop);
      const items = dialog.querySelector('.rich-library-items'); const search = dialog.querySelector('input');
      const load = function () { fetch(endpoint + (endpoint.includes('?') ? '&' : '?') + 'q=' + encodeURIComponent(search.value)).then(function (r) { return r.json(); }).then(function (data) { items.innerHTML = ''; (data.items || []).forEach(function (item) { const button = document.createElement('button'); button.type = 'button'; button.className = 'rich-library-item'; button.textContent = (item.title || 'Item') + (item.code ? ' · ' + item.code : ''); button.addEventListener('click', function () { onSelect(item); backdrop.remove(); }); items.appendChild(button); }); if (!items.children.length) items.innerHTML = '<span>Nenhum item disponível.</span>'; }).catch(function () { items.innerHTML = '<span>Não foi possível carregar a biblioteca.</span>'; }); };
      dialog.querySelector('[data-close]').addEventListener('click', function () { backdrop.remove(); }); backdrop.addEventListener('click', function (event) { if (event.target === backdrop) backdrop.remove(); }); search.addEventListener('input', load); load();
    }
  });
</script>
