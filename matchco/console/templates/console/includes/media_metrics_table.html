{% load dam_tags %}<section class="overflow-hidden rounded-xl border border-default bg-neutral-primary-soft"><div class="border-b border-default p-5"><h2 class="font-semibold text-heading">{{ title }}</h2></div><div class="divide-y divide-default">{% for asset in items %}<a href="{% url 'console:media-edit' asset.pk %}" class="flex items-center justify-between gap-4 px-5 py-3 hover:bg-neutral-secondary-soft"><span class="min-w-0 truncate text-sm font-medium text-heading">{{ asset.title }}</span><span class="shrink-0 text-xs text-body">{% if metric == 'valid_until' %}{{ asset.valid_until|date:'d/m/Y' }}{% else %}{{ asset|media_metric:metric|default:0 }}{% endif %}</span></a>{% empty %}<p class="px-5 py-8 text-center text-sm text-body">{{ empty }}</p>{% endfor %}</div></section>
