{% load i18n %}
<label for="{{ field.id_for_label }}" class="mb-2 block text-sm font-medium text-heading">{{ field.label }}{% if field.field.required %}<span class="ml-1 text-brand" aria-hidden="true">*</span>{% endif %}</label>
{{ field }}
{% if field.help_text %}<p class="mt-1.5 text-xs text-body">{{ field.help_text }}</p>{% endif %}
{% for error in field.errors %}<p class="mt-1.5 text-xs font-medium text-red-600 dark:text-red-400">{{ error }}</p>{% endfor %}
