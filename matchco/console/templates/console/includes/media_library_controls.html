
{% load i18n %}<form method="get" class="flex flex-wrap items-end gap-3 rounded-xl border border-default bg-neutral-primary-soft p-4"><label class="text-sm font-medium text-heading">{% trans "Status" %}<select name="workflow_status" class="mt-2 block rounded-lg border border-default-medium bg-neutral-secondary-medium px-3 py-2.5 text-sm text-heading"><option value="">{% trans "Todos" %}</option><option value="draft" {% if request.GET.workflow_status == 'draft' %}selected{% endif %}>{% trans "Rascunho" %}</option><option value="review" {% if request.GET.workflow_status == 'review' %}selected{% endif %}>{% trans "Em revisão" %}</option><option value="approved" {% if request.GET.workflow_status == 'approved' %}selected{% endif %}>{% trans "Aprovado" %}</option><option value="published" {% if request.GET.workflow_status == 'published' %}selected{% endif %}>{% trans "Publicado" %}</option><option value="archived" {% if request.GET.workflow_status == 'archived' %}selected{% endif %}>{% trans "Arquivado" %}</option></select></label><label class="text-sm font-medium text-heading">{% trans "Ordenar" %}<select name="sort" class="mt-2 block rounded-lg border border-default-medium bg-neutral-secondary-medium px-3 py-2.5 text-sm text-heading"><option value="updated" {% if request.GET.sort == 'updated' or not request.GET.sort %}selected{% endif %}>{% trans "Atualização" %}</option><option value="name" {% if request.GET.sort == 'name' %}selected{% endif %}>{% trans "Nome" %}</option><option value="size" {% if request.GET.sort == 'size' %}selected{% endif %}>{% trans "Tamanho" %}</option><option value="access" {% if request.GET.sort == 'access' %}selected{% endif %}>{% trans "Mais acessadas" %}</option><option value="last_access" {% if request.GET.sort == 'last_access' %}selected{% endif %}>{% trans "Último acesso" %}</option></select></label><input type="hidden" name="q" value="{{ request.GET.q }}"><input type="hidden" name="kind" value="{{ request.GET.kind }}"><input type="hidden" name="collection" value="{{ request.GET.collection }}"><input type="hidden" name="tag" value="{{ request.GET.tag }}"><button class="rounded-lg bg-brand px-4 py-2.5 text-sm font-semibold text-white">{% trans "Aplicar" %}</button></form>
