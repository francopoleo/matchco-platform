<a href="{{ app.url }}" class="group block rounded-xl border border-default bg-neutral-primary-soft p-6 shadow-xs transition duration-200 hover:-translate-y-0.5 hover:bg-neutral-secondary-medium hover:shadow-md dark:bg-gray-800">
    <div class="flex items-center gap-4">
        {% if app.tone == 'cyan' %}<span class="grid h-12 w-12 shrink-0 place-items-center rounded-xl bg-cyan-100 text-cyan-600 dark:bg-cyan-900/40 dark:text-cyan-300" aria-hidden="true">
        {% elif app.tone == 'emerald' %}<span class="grid h-12 w-12 shrink-0 place-items-center rounded-xl bg-emerald-100 text-emerald-600 dark:bg-emerald-900/40 dark:text-emerald-300" aria-hidden="true">
        {% elif app.tone == 'amber' %}<span class="grid h-12 w-12 shrink-0 place-items-center rounded-xl bg-amber-100 text-amber-600 dark:bg-amber-900/40 dark:text-amber-300" aria-hidden="true">
        {% elif app.tone == 'fuchsia' %}<span class="grid h-12 w-12 shrink-0 place-items-center rounded-xl bg-fuchsia-100 text-fuchsia-600 dark:bg-fuchsia-900/40 dark:text-fuchsia-300" aria-hidden="true">
        {% else %}<span class="grid h-12 w-12 shrink-0 place-items-center rounded-xl bg-violet-100 text-violet-600 dark:bg-violet-900/40 dark:text-violet-300" aria-hidden="true">
        {% endif %}
            {% include 'ui/components/icon.html' with name=app.icon %}
        </span>
        <div class="min-w-0 flex-1">
            <h3 class="text-base font-semibold text-heading">{{ app.label }}</h3>
            {% if app.description %}<p class="mt-1 text-sm text-body">{{ app.description }}</p>{% endif %}
        </div>
        <svg class="h-5 w-5 text-body transition-transform group-hover:translate-x-1 rtl:rotate-180" fill="none" viewBox="0 0 24 24" aria-hidden="true"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 12H5m14 0-4 4m4-4-4-4"/></svg>
    </div>
</a>
