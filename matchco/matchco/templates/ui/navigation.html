{% load static %}
<link rel="stylesheet" href="{% static 'ui/css/tailwind.css' %}?v=2">
<script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js" defer></script>
<script>
    (function () {
        var dark = localStorage.getItem('color-theme') === 'dark' ||
            (!localStorage.getItem('color-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
    })();
</script>
{% include 'ui/navbar.html' %}
{% include 'ui/sidebar.html' %}
<div id="app-backdrop" class="fixed inset-0 z-30 hidden bg-slate-950/60 lg:hidden"></div>
<div id="app-main" class="min-h-screen p-4 pt-20 transition-all duration-300 lg:ml-64 lg:p-8">
<script src="{% static 'ui/js/theme.js' %}?v=debug-4" defer></script>
<script src="{% static 'ui/js/app-shell.js' %}?v=4" defer></script>
