{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Home" %}{% endblock %}

{% block content %}
{% if user.is_authenticated %}
  {% trans "Hi" %} {{ user.username }}!
{% else %}
  <p>{% trans "You are not logged in" %}</p>
  <a href="{% url 'login' %}">{% trans "Log In" %}</a>
{% endif %}
{% endblock %}
