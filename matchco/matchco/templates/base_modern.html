{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titletag %}MatchCo{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'ui/css/app.css' %}?v=6">
    {% block extra_css %}{% endblock %}
    <script>
        (function () {
            var dark = localStorage.getItem('color-theme') === 'dark' ||
                (!localStorage.getItem('color-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.classList.toggle('dark', dark);
        })();
    </script>
</head>
<body class="bg-gray-50 text-heading app-shell {% block bodyclass %}{% endblock %} dark:bg-gray-900">
    {% include 'ui/navbar.html' %}
    {% include 'ui/sidebar.html' %}
    <div id="app-backdrop" class="fixed inset-0 z-30 hidden bg-slate-950/60 lg:hidden"></div>
    <main id="app-main" class="min-h-screen bg-gray-50 pt-16 transition-all duration-300 lg:ml-64 dark:bg-gray-900">
        <div class="w-full max-w-full px-4 py-4 sm:px-6 sm:py-8 lg:px-8">{% block content %}{% endblock %}</div>
    </main>
    <script src="{% static 'ui/js/theme.js' %}?v=debug-4"></script>
    <script src="{% static 'ui/js/app-shell.js' %}?v=5"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
