
{% load i18n %}<div class="mb-5 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-gray-500 dark:text-gray-400">
  {% if object.published_at %}<time datetime="{{ object.published_at|date:'c' }}">{% trans "Publicado em" %} {{ object.published_at|date:'d/m/Y H:i:s' }}</time>{% endif %}
  {% if object.updated_at %}<time datetime="{{ object.updated_at|date:'c' }}">{% trans "Modificado em" %} {{ object.updated_at|date:'d/m/Y H:i:s' }}</time>{% endif %}
</div>
