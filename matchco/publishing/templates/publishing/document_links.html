{% if linked_documents %}<section class="mt-8 rounded-xl border border-blue-200 bg-blue-50 p-5 dark:border-blue-900/60 dark:bg-blue-950/20"><p class="text-xs font-bold uppercase tracking-wider text-blue-700 dark:text-blue-300">Documentos relacionados</p><div class="mt-3 grid gap-3 sm:grid-cols-2">{% for link in linked_documents %}<a href="{% url 'document-detail' slug=link.document.slug %}" class="rounded-lg border border-blue-200 bg-white p-4 transition hover:border-blue-400 hover:shadow-sm dark:border-blue-900/60 dark:bg-gray-800"><p class="font-semibold text-gray-900 dark:text-white">{{ link.document.title }}</p><p class="mt-1 text-xs text-gray-500 dark:text-gray-400">{{ link.document.get_category_display }} · versão {{ link.document.current_version.version_number }}</p></a>{% endfor %}</div></section>{% endif %}
