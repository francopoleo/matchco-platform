<div class="mt-8">
  <div class="rounded-lg border border-gray-200 bg-gray-50 px-4 py-3 dark:border-gray-700 dark:bg-gray-900/50">
    <p class="text-xs font-semibold text-gray-900 dark:text-white">Esta informação ajudou?</p>
    <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">Sua resposta é privada.</p>
    <div id="feedback-start" class="mt-2 flex flex-wrap gap-2"><button type="button" data-feedback-rating="helpful" class="rounded-lg border border-emerald-200 bg-white px-3 py-2 text-sm font-medium text-emerald-700 hover:bg-emerald-50 dark:border-emerald-800 dark:bg-gray-800 dark:text-emerald-300">Sim, ajudou</button><button type="button" data-feedback-rating="partial" class="rounded-lg border border-amber-200 bg-white px-3 py-2 text-sm font-medium text-amber-700 hover:bg-amber-50 dark:border-amber-800 dark:bg-gray-800 dark:text-amber-300">Parcialmente</button><button type="button" data-feedback-rating="not_helpful" class="rounded-lg border border-red-200 bg-white px-3 py-2 text-sm font-medium text-red-700 hover:bg-red-50 dark:border-red-800 dark:bg-gray-800 dark:text-red-300">Não ajudou</button></div>
    <form id="feedback-form" class="mt-4 hidden space-y-3" method="post" action="{% url 'content_feedback' %}">{% csrf_token %}{% if feedback_content_id %}<input type="hidden" name="content_id" value="{{ feedback_content_id }}">{% else %}<input type="hidden" name="publication_id" value="{{ object.pk }}">{% endif %}<input id="feedback-rating" type="hidden" name="rating"><label class="block text-xs font-medium text-gray-700 dark:text-gray-300" for="feedback-reason">O que faltou? <span class="font-normal text-gray-500">(opcional)</span></label><select id="feedback-reason" name="reason" class="block w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 dark:border-gray-600 dark:bg-gray-800 dark:text-white"><option value="">Escolha um motivo</option><option value="outdated">Estava desatualizada</option><option value="unclear">Não estava clara</option><option value="missing">Faltou informação</option><option value="hard_to_find">Foi difícil encontrar</option><option value="other">Outro motivo</option></select><textarea name="comment" rows="2" maxlength="1000" class="block w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 dark:bg-gray-800 dark:text-white" placeholder="Conte, se quiser, como podemos melhorar"></textarea><button class="inline-flex rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700" type="submit">Enviar feedback privado</button></form>
    <p id="feedback-success" class="mt-3 hidden text-sm font-medium text-emerald-700 dark:text-emerald-300">Obrigado. Seu feedback foi registrado.</p>
  </div>
</div>
<script>
(() => {
  const start = document.getElementById('feedback-start'); const form = document.getElementById('feedback-form'); const rating = document.getElementById('feedback-rating'); const success = document.getElementById('feedback-success');
  document.querySelectorAll('[data-feedback-rating]').forEach(button => button.addEventListener('click', () => { rating.value = button.dataset.feedbackRating; if (rating.value === 'helpful') { fetch(form.action, {method: 'POST', body: new FormData(form), headers: {'X-Requested-With': 'XMLHttpRequest'}}).then(() => { start.classList.add('hidden'); success.classList.remove('hidden'); }); } else { start.classList.add('hidden'); form.classList.remove('hidden'); } }));
  form.addEventListener('submit', event => { event.preventDefault(); fetch(form.action, {method: 'POST', body: new FormData(form), headers: {'X-Requested-With': 'XMLHttpRequest'}}).then(() => { form.classList.add('hidden'); success.classList.remove('hidden'); }); });
})();
</script>
