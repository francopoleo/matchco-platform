
{% load i18n %}<section class="mt-5 rounded-xl border border-violet-200 bg-violet-50 p-5 dark:border-violet-900/60 dark:bg-violet-950/20" aria-labelledby="question-title"><h2 id="question-title" class="text-sm font-semibold text-gray-900 dark:text-white">{% trans "Ficou alguma dúvida?" %}</h2><p class="mt-1 text-xs text-gray-600 dark:text-gray-400">{% trans "Envie uma pergunta privada para o responsável pelo conteúdo." %}</p><form id="content-question-form" class="mt-3 space-y-3" method="post" action="{% url 'content_question' %}">{% csrf_token %}<input type="hidden" name="publication_id" value="{{ object.pk }}"><textarea name="question" rows="3" maxlength="2000" required class="block w-full rounded-lg border border-violet-200 bg-white p-3 text-sm text-gray-900 dark:border-violet-800 dark:bg-gray-800 dark:text-white" placeholder="{% trans "O que ficou faltando ou difícil de aplicar?" %}"></textarea><button class="rounded-lg bg-violet-600 px-4 py-2 text-sm font-semibold text-white hover:bg-violet-700">{% trans "Enviar dúvida" %}</button><p id="question-success" class="hidden text-sm font-medium text-emerald-700 dark:text-emerald-300">{% trans "Dúvida registrada. O responsável poderá respondê-la." %}</p></form></section>
<script>(function(){const form=document.getElementById('content-question-form');const success=document.getElementById('question-success');if(!form)return;form.addEventListener('submit',async function(event){event.preventDefault();const response=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{'X-Requested-With':'XMLHttpRequest'}});if(response.ok){form.querySelector('textarea').value='';success.classList.remove('hidden');}});})();</script>
