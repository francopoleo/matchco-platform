version: '3.3'

services:
  db:
    image: postgres:10.1-alpine
    container_name: matchco-db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - 5432:5432
  app:
    build:
      context: .
    # environment:
    #   - DJANGO_SETTINGS_MODULE=matchco.settings.dev
    container_name: matchco-app
    working_dir: /matchco
    volumes:
      - ./matchco:/matchco
      - ./config:/matchco/config
    env_file: .env
    entrypoint: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    # command: python manage.py runserver 0.0.0.0:8000
    ports:
      - 8000:8000
    depends_on:
      - db

volumes:
  postgres_data:
