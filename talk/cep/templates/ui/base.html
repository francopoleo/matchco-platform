{% load static i18n %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'pt-br' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="{% static 'assets/logos/favicon.ico' %}">
    <link rel="manifest" href="{% static 'ui/manifest.webmanifest' %}">
    <meta name="theme-color" content="#2563eb">
    <title>{% block title %}Talk{% endblock %} | Talk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    borderRadius: {
                        'sm': '0.25rem',
                        'base': '0.375rem',
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.0.0/dist/flowbite.min.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.classList.add('dark'); } else { document.documentElement.classList.remove('dark'); }
    </script>
    <link rel="stylesheet" href="{% static 'ui/css/app.css' %}?v=7">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 text-heading {% block bodyclass %}{% endblock %} dark:bg-gray-900">
    {% include 'ui/navbar.html' %}
    {% include 'ui/sidebar.html' %}
    <div id="app-backdrop" class="fixed inset-0 z-30 hidden bg-slate-950/60 lg:hidden"></div>
    <main id="app-main" class="min-h-screen bg-gray-50 pt-16 transition-all duration-300 lg:ml-64 dark:bg-gray-900">
        <div class="w-full max-w-full px-4 py-8 lg:px-8">{% block content %}{% endblock %}</div>
    </main>
    <script src="{% static 'ui/js/theme.js' %}?v=debug-3"></script>
    <script src="{% static 'ui/js/app-shell.js' %}?v=6"></script>
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js').catch(() => {});</script>
    {% block extra_js %}{% endblock %}
</body>
</html>
