{% load static i18n %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'pt-br' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="{% static 'matchco_site/img/matchco-icone-m.svg' %}">
    <meta name="theme-color" content="#2563eb">
    <title>{% block title %}MatchCo{% endblock %} | MatchCo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    borderRadius: {
                        'sm': '0.25rem',
                        'base': '0.375rem',
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.0.0/dist/flowbite.min.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.classList.add('dark'); } else { document.documentElement.classList.remove('dark'); }
    </script>
    <link rel="stylesheet" href="{% static 'ui/css/app.css' %}?v=9">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 text-heading {% block bodyclass %}{% endblock %} dark:bg-gray-900">
    {% include 'ui/navbar.html' %}
    {% include 'ui/sidebar.html' %}
    <div id="app-backdrop" class="fixed inset-0 z-30 hidden bg-slate-950/60 lg:hidden"></div>
    <main id="app-main" class="min-h-screen bg-gray-50 pt-16 transition-all duration-300 lg:ml-64 dark:bg-gray-900">
        <div class="w-full max-w-full px-4 py-4 sm:px-6 sm:py-8 lg:px-8">{% block content %}{% endblock %}</div>
    </main>
    <script src="{% static 'ui/js/theme.js' %}?v=debug-4"></script>
    <script src="{% static 'ui/js/app-shell.js' %}?v=6"></script>
    <script>
        // Enable HTMX on all GET forms - only if #app-main exists (console)
        function enableHTMXForForms() {
            if (!document.getElementById('app-main')) return; // Not console, skip HTMX

            let updated = false;
            document.querySelectorAll('form[method="get"]').forEach(form => {
                if (!form.hasAttribute('hx-boost')) {
                    form.setAttribute('hx-boost', 'true');
                    form.setAttribute('hx-target', '#app-main');
                    form.setAttribute('hx-swap', 'outerHTML');
                    form.setAttribute('hx-select', '#app-main');
                    form.setAttribute('hx-push-url', 'true');
                    updated = true;
                }
            });

            // Reprocess DOM for newly added HTMX attributes
            if (updated && window.htmx) {
                htmx.process(document.body);
            }
        }

        // Initialize on page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', enableHTMXForForms);
        } else {
            enableHTMXForForms();
        }

        // Re-enable when HTMX loads new content
        document.addEventListener('htmx:afterSettle', enableHTMXForForms);

        // Smooth page transitions - reduce flicker on navigation
        (function() {
            const main = document.getElementById('app-main');
            if (main) {
                // Add fade-in effect
                main.style.opacity = '0';
                main.style.transition = 'opacity 0.2s ease-in';
                setTimeout(() => { main.style.opacity = '1'; }, 10);
            }
            // Preload sidebar state to prevent flash
            if (localStorage) {
                document.documentElement.style.colorScheme = localStorage.getItem('color-theme') || 'light';
            }
        })();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js').catch(() => {});
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
