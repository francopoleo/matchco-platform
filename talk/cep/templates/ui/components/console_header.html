<header class="console-page-header flex flex-wrap items-start justify-between gap-4">
    <div>
        <p class="console-eyebrow">{{ eyebrow|default:'Talk Console' }}</p>
        <h1 class="console-page-title">{{ page_title }}</h1>
        {% if page_subtitle %}<p class="console-page-subtitle">{{ page_subtitle }}</p>{% endif %}
    </div>
    {% if action_url %}<a href="{{ action_url }}" class="inline-flex items-center gap-2 rounded-lg bg-brand px-4 py-2.5 text-sm font-medium text-white shadow-xs hover:bg-brand-strong focus:outline-none focus:ring-4 focus:ring-brand-medium">{% if action_label %}{{ action_label }}{% else %}Novo{% endif %}</a>{% endif %}
</header>
