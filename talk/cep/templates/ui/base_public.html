{% load static i18n %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'pt-br' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="{% static 'assets/logos/favicon.ico' %}">
    <meta name="theme-color" content="#2563eb">
    <title>{% block title %}Talk{% endblock %} | Talk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    borderRadius: {
                        'sm': '0.25rem',
                        'base': '0.375rem',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.classList.add('dark'); } else { document.documentElement.classList.remove('dark'); }
    </script>
    <link rel="stylesheet" href="{% static 'ui/css/app.css' %}?v=7">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 text-heading dark:bg-gray-900">
    <main class="min-h-screen bg-gray-50 dark:bg-gray-900">
        {% block content %}{% endblock %}
    </main>
    <script src="{% static 'ui/js/theme.js' %}?v=debug-3"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
