{% extends './base.html' %}

{% block title %} <title>Senha Alterada</title> {% endblock %}

{% load static %}
{% block content %}
    <div class="limiter">
        <div class="container-login100">
            <div class="wrap-login100">
                <div class="login100-form validate-form">
                    {% csrf_token %}
                    <div class="mobile-logo">
                        <img src="{% static 'assets/logos/logo_color.svg' %}" alt="Epson" height="100px">
                    </div>
                    <span class="login100-form-title p-b-34">
						Sua senha foi alterada com sucesso!
					</span>
                    <div class="alert alert-warning text-center">
                        <span>Você já pode entrar no sistema utilizando sua nova senha de acesso.</span>
                    </div>
                    <div class="w-full text-center div-forgot-signin p-t-30">
                        <div>
                            <a href="{% url 'login' %}" class="txt3">
                                Voltar ao login
                            </a>
                        </div>
                    </div>
                </div>
                <div class="login100-more">
                    <img class="logo-epson-web" src="{% static 'assets/logos/logo_color.svg' %}" alt="Epson"
                         height="100px"/>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
