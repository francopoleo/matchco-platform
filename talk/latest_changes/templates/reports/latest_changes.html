{% load static i18n %}
<!doctype html><html lang="{{ LANGUAGE_CODE }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% trans "Latest changes" %}</title><link rel="stylesheet" href="{% static 'ui/css/app.css' %}"></head>
<body class="app-shell"><main class="app-container"><div class="page-heading"><h1>{% trans "Latest changes" %}</h1></div><div class="card"><table class="data-table"><thead><tr><th>{% trans "Content" %}</th><th>{% trans "Type" %}</th><th>{% trans "Updated" %}</th></tr></thead><tbody>{% for item in changes %}<tr><td><a href="{{ item.url }}">{{ item.title }}</a></td><td>{{ item.kind }}</td><td>{{ item.updated_at }}</td></tr>{% empty %}<tr><td colspan="3">{% trans "No changes found." %}</td></tr>{% endfor %}</tbody></table></div></main></body></html>
