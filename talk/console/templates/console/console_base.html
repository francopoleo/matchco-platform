{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'pt-br' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Console{% endblock %} - Talk Learning</title>
    <link rel="stylesheet" href="{% static 'ui/css/tailwind.css' %}?v=2">
    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js" defer></script>
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <link rel="stylesheet" href="{% static 'ui/css/app.css' %}?v=4">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white">
    {% include 'console/navbar_console.html' %}
    {% include 'console/sidebar_console.html' %}

    <main class="pt-16 min-h-screen transition-all duration-300 lg:ml-64" id="console-main">
        <div class="p-4 lg:p-8">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script src="{% static 'ui/js/theme.js' %}?v=debug-3"></script>
    <script src="{% static 'ui/js/console-shell.js' %}?v=1"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
