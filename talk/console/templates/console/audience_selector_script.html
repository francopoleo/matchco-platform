<script>
(() => { const get=id=>document.getElementById(id), org=get('id_organization'), companies=get('id_companies'), units=get('id_business_units'), operational=get('id_operational_units'), channels=get('id_channels'), functions=get('id_functions'); if(!org||!companies)return; const selected=s=>Array.from(s?.selectedOptions||[]).map(o=>o.value); const refill=async(s,url,ids,company_ids=[])=>{const q=new URLSearchParams();ids.forEach(v=>q.append('ids',v));company_ids.forEach(v=>q.append('company_ids',v));const r=await fetch(`${url}?${q}`),items=await r.json();s.innerHTML='';items.forEach(i=>s.add(new Option(i.name,i.id)));}; const clear=s=>{if(s)s.innerHTML='';}; org.addEventListener('change',async()=>{clear(companies);clear(units);clear(operational);clear(channels);clear(functions);if(org.value)await refill(companies,'/companies/api/',[org.value]);}); companies.addEventListener('change',async()=>{const ids=selected(companies);clear(units);clear(operational);clear(channels);clear(functions);if(ids.length){await refill(units,'/business-units/api/',ids);await refill(channels,'/business-channels/api/',ids);await refill(functions,'/job-functions/api/',[],ids);}}); units?.addEventListener('change',async()=>{const ids=selected(units);clear(operational);if(ids.length)await refill(operational,'/operational-units/api/',ids);}); })();
</script>
