{% extends 'console/base.html' %}
{% load i18n %}
{% block title %}{% trans 'Tipo de Pessoa' %}{% endblock %}
{% block content %}
<div class="w-full max-w-2xl mx-auto">
  <a href="{% url 'console:person_type_list' %}" class="text-blue-600 mb-6 inline-block">← {% trans 'Voltar' %}</a>
  <form method="post" class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-8 space-y-6">
    {% csrf_token %}
    {% for field in form %}
    <div><label class="block text-sm font-medium mb-2">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-red-600 text-sm">{{ field.errors }}</div>{% endif %}</div>
    {% endfor %}
    <div class="flex gap-3 pt-6 border-t">
      <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg">{% trans 'Salvar' %}</button>
    </div>
  </form>
</div>
<style>input,select,textarea{width:100%;padding:0.5rem;border:1px solid #d1d5db;border-radius:0.375rem;}</style>
{% endblock %}
