{% load i18n %}
<aside id="console-sidebar" class="fixed bottom-0 left-0 top-0 z-40 w-64 -translate-x-full border-r border-gray-200 bg-white pt-16 transition-transform lg:translate-x-0 dark:border-gray-700 dark:bg-gray-800">
    <div class="h-full overflow-y-auto px-3 py-5">
        <p class="mb-4 px-3 text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">{% trans 'Management' %}</p>
        <ul class="space-y-1 font-medium">
            <li>
                <a href="{% url 'console:course-list' %}" class="flex items-center rounded-lg p-3 text-gray-700 hover:bg-gray-100 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white">
                    <svg class="h-5 w-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                    <span class="ms-3">{% trans 'Courses' %}</span>
                </a>
            </li>
            <li>
                <a href="{% url 'console:publication-list' %}?kind=feed" class="flex items-center rounded-lg p-3 text-gray-700 hover:bg-gray-100 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white">
                    <svg class="h-5 w-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 12H9m6 0a6 6 0 11-12 0 6 6 0 0112 0z"/>
                    </svg>
                    <span class="ms-3">{% trans 'Feed' %}</span>
                </a>
            </li>
            <li>
                <a href="{% url 'console:publication-list' %}?kind=wiki" class="flex items-center rounded-lg p-3 text-gray-700 hover:bg-gray-100 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white">
                    <svg class="h-5 w-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span class="ms-3">{% trans 'Wiki' %}</span>
                </a>
            </li>
            <li><a href="{% url 'console:policy-list' %}" class="flex items-center rounded-lg p-3 text-gray-700 hover:bg-gray-100 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white"><span class="grid h-5 w-5 place-items-center">✓</span><span class="ms-3">{% trans 'Audience rules' %}</span></a></li>
            <li><a href="{% url 'console:user-list' %}" class="flex items-center rounded-lg p-3 text-gray-700 hover:bg-gray-100 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white"><span class="grid h-5 w-5 place-items-center">◉</span><span class="ms-3">{% trans 'Users' %}</span></a></li>
        </ul>

        <div class="absolute bottom-4 left-3 right-3 border-t border-gray-200 pt-3 text-center text-xs text-gray-500 dark:border-gray-700 dark:text-gray-400">Talk · Console</div>
    </div>
</aside>

<div id="console-sidebar-overlay" class="fixed inset-0 z-30 hidden bg-slate-950/60 lg:hidden"></div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const sidebarToggle = document.getElementById('console-sidebar-toggle');
        const sidebar = document.getElementById('console-sidebar');
        const overlay = document.getElementById('console-sidebar-overlay');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', toggleSidebar);
        }

        if (overlay) {
            overlay.addEventListener('click', toggleSidebar);
        }

        sidebar?.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth < 1024) {
                    toggleSidebar();
                }
            });
        });

        // User menu
        const userMenuButton = document.getElementById('console-user-menu-button');
        const userMenu = document.getElementById('console-user-menu');

        if (userMenuButton && userMenu) {
            userMenuButton.addEventListener('click', (e) => {
                e.stopPropagation();
                userMenu.classList.toggle('hidden');
            });

            document.addEventListener('click', (e) => {
                if (!userMenuButton.contains(e.target) && !userMenu.contains(e.target)) {
                    userMenu.classList.add('hidden');
                }
            });
        }
    });
</script>
