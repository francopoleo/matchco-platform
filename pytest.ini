[pytest]
DJANGO_SETTINGS_MODULE = matchco.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
asyncio_mode = auto

markers =
    e2e: End-to-end tests (critical paths)
    performance: Performance and load tests
    regression: Regression tests for Phases 4-5
    slow: Slow tests (may take >10 seconds)
    browser: Browser compatibility tests

# Capture options
addopts =
    --strict-markers
    --tb=short
    -ra

# Timeout (seconds)
timeout = 300

# Django
django_db_use_transactions = true
